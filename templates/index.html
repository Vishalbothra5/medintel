<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medical AI — 3-Layer Diagnosis System</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --blue: #58a6ff;
      --orange: #f0883e;
      --red: #f85149;
      --purple: #bc8cff;
      --yellow: #d29922;
      --teal: #39d353;
      --layer1: #1f6feb;
      --layer2: #388bfd;
      --layer3: #a371f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #161b22 0%, #1f2937 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header .logo {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--layer1), var(--layer3));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .layer-badges { margin-left: auto; display: flex; gap: 8px; }
    .badge {
      padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
    }
    .badge-l1 { background: rgba(31,111,235,.25); color: var(--layer1); border: 1px solid var(--layer1); }
    .badge-l2 { background: rgba(56,139,253,.2); color: var(--layer2); border: 1px solid var(--layer2); }
    .badge-l3 { background: rgba(163,113,247,.2); color: var(--layer3); border: 1px solid var(--layer3); }

    /* ── Layout ── */
    .main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
    .grid { display: grid; grid-template-columns: 420px 1fr; gap: 24px; align-items: start; }
    @media(max-width: 820px) { .grid { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.9rem;
      display: flex; align-items: center; gap: 8px;
    }
    .card-body { padding: 20px; }

    /* ── Form ── */
    label { font-size: 0.82rem; color: var(--muted); display: block; margin-bottom: 6px; font-weight: 500; }
    .form-group { margin-bottom: 16px; }
    input, select, textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 10px 12px;
      font-size: 0.88rem; outline: none; transition: border-color .2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); }
    textarea { resize: vertical; min-height: 80px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* Tags input */
    .tags-box {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 10px; min-height: 46px; display: flex; flex-wrap: wrap; gap: 6px;
      cursor: text; transition: border-color .2s;
    }
    .tags-box:focus-within { border-color: var(--blue); }
    .tag {
      background: rgba(88,166,255,.15); color: var(--blue); border: 1px solid rgba(88,166,255,.3);
      border-radius: 6px; padding: 2px 8px; font-size: 0.8rem; display: flex;
      align-items: center; gap: 4px; white-space: nowrap;
    }
    .tag button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; line-height: 1; padding: 0; }
    .tag button:hover { color: var(--red); }
    .tags-input { background: none; border: none; outline: none; color: var(--text); flex: 1; min-width: 140px; font-size: 0.88rem; padding: 2px 0; }

    /* Autocomplete */
    .autocomplete-box { position: relative; }
    .autocomplete-list {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      max-height: 180px; overflow-y: auto; display: none; box-shadow: 0 8px 24px #0008;
    }
    .autocomplete-list.show { display: block; }
    .ac-item {
      padding: 8px 12px; font-size: 0.85rem; cursor: pointer; transition: background .15s;
    }
    .ac-item:hover, .ac-item.active { background: var(--border); }

    /* Submit */
    .btn {
      width: 100%; padding: 12px; background: linear-gradient(135deg, var(--layer1), var(--layer3));
      color: #fff; border: none; border-radius: 8px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer; transition: opacity .2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Results ── */
    #result { display: none; }

    /* Layer indicator */
    .layers-used {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .layer-pill {
      padding: 5px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .layer-pill.active-l1 { background: rgba(31,111,235,.2); color: #58a6ff; border: 1px solid var(--layer1); }
    .layer-pill.active-l2 { background: rgba(56,139,253,.15); color: #79c0ff; border: 1px solid var(--layer2); }
    .layer-pill.active-l3 { background: rgba(163,113,247,.2); color: #d2a8ff; border: 1px solid var(--layer3); }
    .layer-pill.inactive { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .dot { width: 7px; height: 7px; border-radius: 50%; }
    .dot-green { background: var(--green); }
    .dot-muted { background: var(--muted); }

    /* Disease heading */
    .disease-heading {
      display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
    }
    .disease-icon {
      width: 52px; height: 52px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 26px;
      background: linear-gradient(135deg, rgba(31,111,235,.3), rgba(163,113,247,.3));
      border: 1px solid rgba(163,113,247,.4);
      flex-shrink: 0;
    }
    .disease-name { font-size: 1.5rem; font-weight: 700; }
    .disease-meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .conf-bar-wrap { margin-top: 8px; }
    .conf-bar-bg { background: var(--surface2); border-radius: 4px; height: 6px; }
    .conf-bar { height: 6px; border-radius: 4px; transition: width .6s ease; }

    /* Info grid */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .info-box {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 14px;
    }
    .info-box .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .info-box .value { font-size: 0.9rem; font-weight: 600; }

    /* Section blocks */
    .section-block {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px 16px; margin-bottom: 12px;
    }
    .section-block .sh {
      font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    }
    .section-block .sh.blue { color: var(--blue); }
    .section-block .sh.orange { color: var(--orange); }
    .section-block .sh.red { color: var(--red); }
    .section-block .sh.purple { color: var(--purple); }
    .section-block .sh.green { color: var(--green); }
    .section-block .sh.yellow { color: var(--yellow); }
    .section-block p { font-size: 0.87rem; line-height: 1.6; color: #cdd5df; }

    /* Agent block */
    .agent-block {
      border: 1px solid rgba(163,113,247,.4);
      background: rgba(163,113,247,.06);
      border-radius: 10px;
      margin-top: 14px;
      overflow: hidden;
    }
    .agent-header {
      background: rgba(163,113,247,.12);
      padding: 10px 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(163,113,247,.2);
    }
    .agent-header .title { font-weight: 700; font-size: 0.88rem; color: #d2a8ff; }
    .agent-header .model-badge {
      margin-left: auto; font-size: 0.72rem; color: var(--muted);
      background: var(--surface2); border: 1px solid var(--border);
      padding: 2px 8px; border-radius: 10px;
    }
    .agent-body { padding: 14px 16px; }
    .agent-body .sub { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: #a371f7; margin-bottom: 6px; margin-top: 12px; }
    .agent-body .sub:first-child { margin-top: 0; }
    .agent-body p { font-size: 0.86rem; line-height: 1.6; color: #cdd5df; }
    .agent-note { font-size: 0.75rem; color: var(--muted); font-style: italic; margin-top: 10px; border-top: 1px solid rgba(163,113,247,.2); padding-top: 10px; }

    /* Emergency banner */
    .emergency-banner {
      background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.5);
      border-radius: 8px; padding: 12px 16px; margin-bottom: 14px;
      display: flex; align-items: center; gap: 10px;
    }
    .emergency-banner .icon { font-size: 1.4rem; }
    .emergency-banner .text { font-size: 0.88rem; color: #ff7b72; font-weight: 600; }

    /* Allergy */
    .allergy-warn {
      background: rgba(240,136,62,.1); border: 1px solid rgba(240,136,62,.4);
      border-radius: 8px; padding: 10px 14px; font-size: 0.84rem;
      color: var(--orange); margin-bottom: 12px;
    }

    /* Error */
    .error-box {
      background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.4);
      border-radius: 8px; padding: 16px; text-align: center;
      color: var(--red); font-size: 0.9rem;
    }

    /* Loader */
    .loader { text-align: center; padding: 40px 20px; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--layer3); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: 0.85rem; color: var(--muted); }
    .loader-sub { font-size: 0.78rem; color: var(--muted); margin-top: 6px; opacity: .7; }

    /* Source tag */
    .source-tag {
      display: inline-block; font-size: 0.72rem; padding: 2px 8px;
      border-radius: 10px; font-weight: 600; margin-left: 6px;
    }
    .src-rule { background: rgba(31,111,235,.2); color: var(--layer1); }
    .src-xgb  { background: rgba(56,139,253,.15); color: var(--layer2); }
    .src-ai   { background: rgba(163,113,247,.2); color: var(--layer3); }

    /* Disclaimer */
    .disclaimer {
      background: rgba(210,153,34,.08); border: 1px solid rgba(210,153,34,.3);
      border-radius: 8px; padding: 10px 14px; font-size: 0.78rem;
      color: var(--yellow); margin-top: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🧠</div>
  <div>
    <h1>Medical AI Diagnosis</h1>
    <p>3-Layer Intelligent Diagnosis System</p>
  </div>
  <div class="layer-badges">
    <span class="badge badge-l1">L1: Rule-Based</span>
    <span class="badge badge-l2">L2: XGBoost</span>
    <span class="badge badge-l3">L3: AI Agent</span>
  </div>
</header>

<div class="main">
  <div class="grid">

    <!-- ── INPUT FORM ── -->
    <div class="card">
      <div class="card-header">🩺 Patient Information</div>
      <div class="card-body">

        <div class="form-group">
          <label>Symptoms <span style="color:var(--red)">*</span></label>
          <div class="autocomplete-box">
            <div class="tags-box" id="tagsBox">
              <input class="tags-input" id="tagInput" placeholder="Type symptom and press Enter…" autocomplete="off" />
            </div>
            <div class="autocomplete-list" id="acList"></div>
          </div>
          <input type="hidden" id="symptomsHidden" name="symptoms" />
        </div>

        <div class="row2">
          <div class="form-group">
            <label>Age</label>
            <input type="number" id="age" value="25" min="1" max="120" />
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select id="gender">
              <option value="">Prefer not to say</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Known Allergies</label>
          <input type="text" id="allergies" placeholder="e.g. penicillin, aspirin (comma separated)" />
        </div>

        <div class="form-group">
          <label>Medical History (optional)</label>
          <textarea id="medical_history" placeholder="e.g. diabetes, hypertension, previous surgeries…"></textarea>
        </div>

        <button class="btn" id="diagnoseBtn" onclick="diagnose()">🔍 Diagnose</button>

        <div class="disclaimer" style="margin-top:14px;">
          ⚠️ This tool is for educational purposes only. Always consult a licensed doctor.
        </div>
      </div>
    </div>

    <!-- ── RESULTS ── -->
    <div id="result">
      <!-- populated by JS -->
    </div>

  </div>
</div>

<script>
// ── Symptom tags ──────────────────────────────────────────
const allSymptoms = {{ all_symptoms | tojson }};
let tags = [];

const tagsBox  = document.getElementById("tagsBox");
const tagInput = document.getElementById("tagInput");
const acList   = document.getElementById("acList");
const symptomsHidden = document.getElementById("symptomsHidden");

tagsBox.addEventListener("click", () => tagInput.focus());

tagInput.addEventListener("input", () => {
  const q = tagInput.value.toLowerCase();
  if (!q) { acList.classList.remove("show"); return; }
  const matches = allSymptoms.filter(s => s.includes(q) && !tags.includes(s)).slice(0, 10);
  acList.innerHTML = matches.map(s => `<div class="ac-item" onclick="addTag('${s}')">${s}</div>`).join("");
  acList.classList.toggle("show", matches.length > 0);
});

tagInput.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === ",") && tagInput.value.trim()) {
    e.preventDefault();
    addTag(tagInput.value.trim().replace(",", ""));
  }
  if (e.key === "Backspace" && !tagInput.value && tags.length) {
    removeTag(tags[tags.length - 1]);
  }
});

document.addEventListener("click", e => {
  if (!tagsBox.contains(e.target)) acList.classList.remove("show");
});

function addTag(sym) {
  sym = sym.trim().toLowerCase();
  if (!sym || tags.includes(sym)) return;
  tags.push(sym);
  renderTags();
  tagInput.value = "";
  acList.classList.remove("show");
}
function removeTag(sym) {
  tags = tags.filter(t => t !== sym);
  renderTags();
}
function renderTags() {
  const existing = tagsBox.querySelectorAll(".tag");
  existing.forEach(t => t.remove());
  tags.forEach(sym => {
    const span = document.createElement("span");
    span.className = "tag";
    span.innerHTML = `${sym} <button onclick="removeTag('${sym}')" title="Remove">×</button>`;
    tagsBox.insertBefore(span, tagInput);
  });
  symptomsHidden.value = tags.join(", ");
}

// ── Diagnose ──────────────────────────────────────────────
async function diagnose() {
  const symptoms = tags.join(", ") || tagInput.value.trim();
  if (!symptoms) { alert("Please enter at least one symptom."); return; }
  if (tagInput.value.trim()) addTag(tagInput.value.trim());

  const btn = document.getElementById("diagnoseBtn");
  btn.disabled = true;
  btn.textContent = "Diagnosing…";

  const result = document.getElementById("result");
  result.style.display = "block";
  result.innerHTML = `
    <div class="card">
      <div class="card-body loader">
        <div class="spinner"></div>
        <div class="loader-text">Running 3-Layer Diagnosis…</div>
        <div class="loader-sub">Layer 1 → Layer 2 → AI Agent (if needed)</div>
      </div>
    </div>`;

  try {
    const resp = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        symptoms,
        age:             document.getElementById("age").value,
        gender:          document.getElementById("gender").value,
        allergies:       document.getElementById("allergies").value,
        medical_history: document.getElementById("medical_history").value,
      })
    });
    const data = await resp.json();
    renderResult(data);
  } catch (err) {
    result.innerHTML = `<div class="card"><div class="card-body"><div class="error-box">⚠️ Network error: ${err.message}</div></div></div>`;
  }

  btn.disabled = false;
  btn.textContent = "🔍 Diagnose";
}

// ── Render ────────────────────────────────────────────────
function renderResult(d) {
  const result = document.getElementById("result");
  if (d.error && !d.disease) {
    result.innerHTML = `<div class="card"><div class="card-body"><div class="error-box">⚠️ ${d.error}</div></div></div>`;
    return;
  }

  const layers = d.layers_used || {};
  const srcClass = d.winner_source?.toLowerCase().includes("agent") ? "src-ai"
                 : d.winner_source?.toLowerCase().includes("xgboost") ? "src-xgb"
                 : "src-rule";

  const confColor = d.confidence >= 70 ? "#3fb950" : d.confidence >= 40 ? "#d29922" : "#f85149";

  // Layer pills
  let layerHTML = `<div class="layers-used">
    <div class="layer-pill ${layers.layer1 ? 'active-l1' : 'inactive'}">
      <div class="dot ${layers.layer1 ? 'dot-green' : 'dot-muted'}"></div>
      Layer 1: Rule-Based ${layers.layer1 ? '✓' : '✗'}
    </div>
    <div class="layer-pill ${layers.layer2 ? 'active-l2' : 'inactive'}">
      <div class="dot ${layers.layer2 ? 'dot-green' : 'dot-muted'}"></div>
      Layer 2: XGBoost ${layers.layer2 ? '✓' : '✗'}
    </div>
    <div class="layer-pill ${layers.layer3 ? 'active-l3' : 'inactive'}">
      <div class="dot ${layers.layer3 ? 'dot-green' : 'dot-muted'}"></div>
      Layer 3: AI Agent ${layers.layer3 ? '✓' : '—'}
    </div>
  </div>`;

  // Emergency
  let emergencyHTML = "";
  const isEmergency = String(d.emergency || "").toLowerCase() === "yes";
  if (isEmergency) {
    const reason = d.agent?.emergency_reason || "Immediate medical attention required.";
    emergencyHTML = `<div class="emergency-banner">
      <div class="icon">🚨</div>
      <div class="text">EMERGENCY — Seek immediate medical attention!<br>
        <span style="font-weight:400;font-size:0.83rem;color:#ffa198">${reason}</span>
      </div>
    </div>`;
  }

  // Allergy warnings
  let allergyHTML = "";
  const allWarn = (d.allergy_warnings || []).concat(
    d.agent?.allergy_warnings_ai && d.agent.allergy_warnings_ai !== "None"
      ? [d.agent.allergy_warnings_ai] : []
  );
  if (allWarn.length) {
    allergyHTML = allWarn.map(w => `<div class="allergy-warn">⚠️ ${w}</div>`).join("");
  }

  // Agent section
  let agentHTML = "";
  if (d.agent) {
    const a = d.agent;
    const triggerLabel = {
      "both_layers_failed": "Both L1 & L2 failed — Agent predicted disease",
      "no_db_record": "No DB prescription — Agent provided precautions",
      "precaution_enhancement": "Agent enhanced precautions",
    }[d.layer3_trigger] || "AI Agent activated";

    agentHTML = `<div class="agent-block">
      <div class="agent-header">
        <span>🤖</span>
        <span class="title">Layer 3 — AI Agent</span>
        <span style="font-size:0.75rem;color:var(--muted);margin-left:4px;">(${triggerLabel})</span>
        <span class="model-badge">📡 ${a.model_used || "OpenRouter"}</span>
      </div>
      <div class="agent-body">
        ${a.enhanced_precautions ? `<div class="sub">Enhanced Precautions</div><p>${a.enhanced_precautions}</p>` : ""}
        ${a.lifestyle_tips ? `<div class="sub">Lifestyle & Diet Tips</div><p>${a.lifestyle_tips}</p>` : ""}
        ${a.warning_signs ? `<div class="sub">⚠️ Warning Signs — See Doctor If</div><p>${a.warning_signs}</p>` : ""}
        ${a.follow_up ? `<div class="sub">Follow-Up Guidance</div><p>${a.follow_up}</p>` : ""}
        ${a.agent_note ? `<div class="agent-note">📋 ${a.agent_note}</div>` : ""}
      </div>
    </div>`;
  }

  result.innerHTML = `
    <div class="card">
      <div class="card-header">📋 Diagnosis Results</div>
      <div class="card-body">

        ${layerHTML}
        ${emergencyHTML}
        ${allergyHTML}

        <!-- Disease -->
        <div class="disease-heading">
          <div class="disease-icon">🦠</div>
          <div>
            <div class="disease-name">${d.disease}
              <span class="source-tag ${srcClass}">${d.winner_source}</span>
            </div>
            <div class="disease-meta">${d.category || ""} · ${d.age_group || ""}</div>
            <div class="conf-bar-wrap">
              <div style="font-size:0.75rem;color:var(--muted);margin-bottom:4px;">Confidence: ${d.confidence}%</div>
              <div class="conf-bar-bg"><div class="conf-bar" style="width:${d.confidence}%;background:${confColor}"></div></div>
            </div>
          </div>
        </div>

        <!-- Drug info -->
        <div class="info-grid">
          <div class="info-box">
            <div class="label">💊 Drug</div>
            <div class="value" style="font-size:0.82rem">${d.drug_name || "—"}</div>
          </div>
          <div class="info-box">
            <div class="label">⏱ Frequency</div>
            <div class="value">${d.frequency || "—"}</div>
          </div>
          <div class="info-box">
            <div class="label">📏 Dosage</div>
            <div class="value" style="font-size:0.8rem">${d.dosage || "—"}</div>
          </div>
          <div class="info-box">
            <div class="label">📅 Duration</div>
            <div class="value">${d.duration_days || "—"}</div>
          </div>
        </div>

        <!-- Sections -->
        ${d.precautions ? `<div class="section-block">
          <div class="sh blue">🛡️ Precautions</div>
          <p>${d.precautions}</p>
        </div>` : ""}

        ${d.what_to_avoid ? `<div class="section-block">
          <div class="sh orange">🚫 What to Avoid</div>
          <p>${d.what_to_avoid}</p>
        </div>` : ""}

        <!-- Agent block -->
        ${agentHTML}

        <div class="disclaimer">
          ⚠️ This is an AI-assisted diagnosis for informational purposes only.
          Always consult a licensed medical professional before starting any treatment.
        </div>
      </div>
    </div>`;
}
